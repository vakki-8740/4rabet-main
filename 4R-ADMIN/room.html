<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Chat room full-screen: only the messages scroll -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chat &mdash; 4R-ADMIN</title>
  <link rel="icon" type="image/jpeg" href="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg">
  <link rel="apple-touch-icon" href="ICONS/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f6bed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="4R-ADMIN">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm-room-page">

  <div class="adm-desktop-note">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
    The admin panel is designed for mobile &mdash; open it on your phone for the best experience.
  </div>

  <!-- ================= HEADER (menu left) ================= -->
  <header class="site-header">
    <div class="header-inner adm-header">

      <div class="menu-wrap">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuDrop">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu-drop" id="menuDrop" aria-label="Admin menu">
          <div class="menu-head">
            <img class="menu-logo" src="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg" alt="4R-ADMIN">
            <button type="button" class="menu-close" id="menuClose" aria-label="Close menu">&times;</button>
          </div>

          <div class="menu-list">
            <a class="menu-item" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg><span>Home</span></a>
            <a class="menu-item" href="chat.html">Chats</a>
            <a class="menu-item" href="visitors.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Visitors</span></a>
            <a class="menu-item" href="settings.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg><span>Settings</span></a>
            <div class="menu-sep" aria-hidden="true"></div>
            <a class="menu-item" href="../index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg><span>User Panel</span></a>
            <a class="menu-item" href="#" data-install style="display:none">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
              Install App
            </a>
            <a class="menu-item" href="#" id="logoutItem"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg><span>Logout</span></a>
          </div>

          <div class="menu-foot">
            <strong>4R BET Admin Panel</strong><br>
            Complaints, live chat and settings in one place.
          </div>
        </nav>
      </div>

      <a class="logo" href="index.html">
        <img class="logo-img adm-logo" src="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg" alt="4R-ADMIN">
      </a>

    </div>
  </header>

  <!-- ================= CHAT ROOM ================= -->
  <main class="adm-room">

    <!-- ---------- ROOM BAR ---------- -->
    <div class="adm-room-bar">
      <a class="adm-back adm-back--ico" href="chat.html" aria-label="Back to chats">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      </a>

      <span class="adm-ava adm-ava--sm">
        <img src="USER-ICON/2288510.png" alt="" data-ua>
      </span>

      <div class="adm-room-who">
        <strong id="roomName">Loading...</strong>
        <small id="roomMeta">Chat khul rahi hai</small>
      </div>

      <button type="button" class="adm-room-del" id="roomDel" title="Delete chat" aria-label="Delete chat">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
      </button>
    </div>

    <!-- ---------- MESSAGES ---------- -->
    <div class="chat-messages adm-room-msgs" id="roomMsgs"></div>

    <button type="button" class="chat-latest" id="roomLatest" aria-label="Latest messages">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
    </button>

    <!-- ---------- ATTACHMENTS ---------- -->
    <div class="chat-actions">
      <button type="button" class="chat-act" id="roomImageBtn" title="Send image">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
          <circle cx="8.5" cy="9.5" r="1.6"></circle>
          <path d="M21 16l-5-5-6.5 6.5"></path>
        </svg>
        <span>Image</span>
      </button>
      <button type="button" class="chat-act" id="roomFileBtn" title="Send file or PDF">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2.5H7.5A2.5 2.5 0 0 0 5 5v14a2.5 2.5 0 0 0 2.5 2.5h9A2.5 2.5 0 0 0 19 19V7.5L14 2.5Z"></path>
          <path d="M14 2.5V7a.5.5 0 0 0 .5.5H19"></path>
        </svg>
        <span>File / PDF</span>
      </button>
      <input type="file" id="roomImage" accept="image/*" hidden>
      <input type="file" id="roomFile" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" hidden>
    </div>

    <!-- ---------- INPUT ---------- -->
    <form class="chat-input" id="roomForm">
      <input type="text" id="roomField" placeholder="Type your reply..." autocomplete="off" required>
      <button type="submit" class="btn btn--send">Send</button>
    </form>

  </main>

  <!-- Firebase SDK -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script defer src="js/firebase-config.js"></script>
  <script defer src="../js/chat-db.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/admin-chat.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";
      window.AdminPanel.initShell();
      window.AdminChat.initRoom();
    });
  </script>
</body>
</html>
