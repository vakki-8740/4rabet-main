<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login &mdash; 4R-ADMIN</title>
  <link rel="icon" type="image/jpeg" href="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg">
  <link rel="apple-touch-icon" href="ICONS/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f6bed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="4R-ADMIN">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* the login page has its own layout */
    .adm-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px 18px;
    }

    .adm-login-logo {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      border: 1px solid var(--line);
      object-fit: cover;
      box-shadow: var(--shadow-hov);
    }

    .adm-login h1 { font-size: 23px; font-weight: 800; letter-spacing: .5px; }
    .adm-login h1 small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--blue);
    }

    .adm-login p.sub { margin-top: -8px; font-size: 14px; color: var(--muted); }

    .adm-login .panel { width: 100%; max-width: 400px; }

    .pwd-wrap { position: relative; }

    .pwd-eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .pwd-eye:hover { background: var(--bg-soft); color: var(--text); }

    .adm-login .pwd-wrap input { padding-right: 46px; }

    .adm-err {
      display: none;
      padding: 12px 14px;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      background: #fef2f2;
      color: #7f1d1d;
      font-size: 14px;
      font-weight: 500;
    }

    .adm-err.is-show { display: block; }

    .adm-login-foot { font-size: 12.5px; color: var(--muted); text-align: center; }
  </style>
</head>
<body data-noauth="1">

  <!-- ================= HEADER (menu left) ================= -->
  <header class="site-header">
    <div class="header-inner adm-header">
      <div class="menu-wrap">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuDrop">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu-drop" id="menuDrop" aria-label="Admin menu">
          <div class="menu-head">
            <img class="menu-logo" src="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg" alt="4R-ADMIN">
            <button type="button" class="menu-close" id="menuClose" aria-label="Close menu">&times;</button>
          </div>

          <div class="menu-list">
            <a class="menu-item" href="visitors.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Visitors</span></a>
            <div class="menu-sep" aria-hidden="true"></div>
            <a class="menu-item" href="../index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg><span>User Panel</span></a>
          </div>

          <div class="menu-foot">
            <strong>4R BET Admin Panel</strong><br>
            Complaints, live chat and settings in one place.
          </div>
        </nav>
      </div>
      <a class="logo" href="login.html">
        <img class="logo-img adm-logo" src="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg" alt="4R-ADMIN">
      </a>
    </div>
  </header>

  <main class="adm-login">

    <img class="adm-login-logo" src="FAVICON/admin-logo-photo_2026-10-01_23-26-57.jpg" alt="4R-ADMIN">

    <h1>4R<small>ADMIN</small></h1>
    <p class="sub">Sign in to the panel</p>

    <div class="panel">
      <h2 class="panel-title">Admin Login</h2>

      <form class="form" id="loginForm" novalidate>
        <div class="adm-err" id="errBox"></div>

        <label class="field">
          <span class="label">Email ID</span>
          <input type="email" id="email" placeholder="4r@admin.com" autocomplete="username" required>
        </label>

        <label class="field">
          <span class="label">Password</span>
          <span class="pwd-wrap">
            <input type="password" id="pass" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="pwd-eye" id="pwdEye" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </span>
        </label>

        <button type="submit" class="btn btn--block"><span class="btn-text">Login</span></button>
      </form>
    </div>

    <p class="adm-login-foot">Only the admin email can sign in.</p>
    <p class="adm-login-foot" id="limitNote">For security this panel allows <b>5 logins per day</b>.</p>

    <button type="button" class="btn btn--block" id="installBtn" data-install style="display:none;max-width:400px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Install App on Phone
    </button>

    <p class="adm-login-foot" id="installHint" style="max-width:400px;display:none"></p>

  </main>

  <!-- Firebase SDK -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";
      var Auth = window.FourRAuth;
      window.AdminPanel.initShell();

      var form = document.getElementById("loginForm");
      var errBox = document.getElementById("errBox");
      var emailIn = document.getElementById("email");
      var passIn = document.getElementById("pass");
      var btn = form.querySelector('button[type="submit"]');

      var next = (new URLSearchParams(window.location.search).get("next") || "index.html");

      function showErr(msg) {
        errBox.textContent = msg;
        errBox.classList.add("is-show");
      }

      function clearErr() { errBox.classList.remove("is-show"); }

      /* the email must match the one in firestore.rules */
      emailIn.value = Auth.adminEmail();

      /* already signed in -> go straight to the panel */
      if (Auth.current()) { location.replace(next); }

      /* page par error (sdk / next) */
      var q = new URLSearchParams(window.location.search).get("err");
      if (q === "sdk") showErr("Firebase did not load. Please check your internet.");

      /* password dikhaao / chhupao */
      document.getElementById("pwdEye").addEventListener("click", function () {
        var showing = passIn.type === "text";
        passIn.type = showing ? "password" : "text";
        this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });

      emailIn.addEventListener("input", clearErr);
      passIn.addEventListener("input", clearErr);

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearErr();

        var mail = emailIn.value.trim();
        var pass = passIn.value;

        if (!mail)  { showErr("Enter your email."); emailIn.focus();  return; }
        if (!pass)  { showErr("Enter your password."); passIn.focus();  return; }
        if (pass.length < 6) { showErr("Password must be at least 6 characters."); passIn.focus(); return; }

        btn.classList.add("is-loading");

        Auth.signIn(mail, pass)
          .then(function (res) {
            if (window.AdminPanel) window.AdminPanel.toast("Login Successful");
            setTimeout(function () { location.replace(next); }, 500);
          })
          .catch(function (err) {
            btn.classList.remove("is-loading");
            showErr(err && err.message ? err.message : "Login failed.");
          });
      });

      /* ---------- install hint ---------- */
      var hint = document.getElementById("installHint");
      if (window.FourRPwa) {
        setTimeout(function () {
          if (window.FourRPwa.installed()) return;
          if (window.FourRPwa.canInstall()) {
            hint.style.display = "block";
            hint.innerHTML = 'Tap the button above to install the app.';
          } else if (window.FourRPwa.isIOS()) {
            hint.style.display = "block";
            hint.innerHTML = 'On iPhone: <b>Share</b> &rarr; <b>Add to Home Screen</b>.';
          } else if (location.protocol !== "file:") {
            hint.style.display = "block";
            hint.innerHTML = 'Or use the Chrome menu (3 dots) &rarr; <b>Install app</b>.';
          }
        }, 2000);
      }
    });
  </script>
</body>
</html>
